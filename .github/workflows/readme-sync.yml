name: Check README Translations

on:
  pull_request:
    paths:
      - "README*.md"
      - "tools/check_readme_sync.py"
      - "tools/tests/**"
      - ".github/workflows/readme-sync.yml"

  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: readme-sync-${{ github.ref }}
  cancel-in-progress: true


jobs:
  readme-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Compares the translations against README.md on roadmap row counts,
      # per-row status, and specification numbers. Prose is never compared.
      - name: Check translations against README.md
        run: python tools/check_readme_sync.py

      - name: Test the checker itself
        run: python -m unittest discover -s tools/tests -v
